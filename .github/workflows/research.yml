name: Daily ClipForge growth research

on:
  schedule:
    # Public-source strategy loop: roughly 02:00, 04:00 and 06:00 Madrid
    # during winter (01:00, 03:00 and 05:00 UTC). It never touches private
    # analytics, credentials, footage or publishing.
    - cron: '0 1,3,5 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipforge-growth-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test without external requests
        run: python -m unittest -v test_research
      - name: Read trusted text sources and produce advice
        run: python research.py
      - name: Save reports only
        run: |
          git add -- reports/strategy.json reports/REPORT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update daily editorial research'
          git push
